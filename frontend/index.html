<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
  <title>貓臉辨識系統 | Cat Face ID</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* RWD 增強 */
    @media (max-width: 768px) {
      header {
        flex-direction: column;
        gap: 10px;
        padding: 15px 20px;
        min-height: auto;
      }

      header > div {
        width: 100%;
      }

      header h1 {
        font-size: 20px;
        margin-bottom: 8px;
      }

      header p {
        font-size: 12px;
        margin: 2px 0;
      }

      nav {
        width: 100%;
        flex-direction: column;
        gap: 8px;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: #eaa63f;
        padding: 10px 20px;
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease;
        border-bottom: 4px solid #5d3e0f;
      }

      nav.active {
        max-height: 400px;
      }

      nav a, nav button {
        width: 100%;
        text-align: center;
        padding: 12px 16px !important;
        font-size: 14px;
      }

      .hamburger {
        display: flex;
        flex-direction: column;
        cursor: pointer;
        gap: 4px;
        position: absolute;
        top: 15px;
        right: 20px;
      }

      .hamburger span {
        width: 25px;
        height: 3px;
        background: white;
        border-radius: 2px;
        transition: all 0.3s ease;
      }

      .hamburger.active span:nth-child(1) {
        transform: rotate(45deg) translate(8px, 8px);
      }

      .hamburger.active span:nth-child(2) {
        opacity: 0;
      }

      .hamburger.active span:nth-child(3) {
        transform: rotate(-45deg) translate(7px, -7px);
      }
    }

    .wrap {
      max-width: 100% !important;
      padding: 16px !important;
      padding-top: 200px !important;
    }

    @media (max-width: 768px) {
      .wrap {
        padding: 12px !important;
        padding-top: 180px !important;
      }
    }

    /* 按鈕 RWD */
    .btns {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .btns button {
      flex: 1;
      min-width: 120px;
      padding: 12px 16px;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      .btns button {
        min-width: 100%;
      }
    }

    /* 相機盒子 RWD */
    .cam-box {
      aspect-ratio: 16 / 9;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }

    /* Panel RWD */
    .panel {
      width: 100%;
      margin-top: 16px;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      .panel .row {
        flex-direction: column;
        gap: 8px;
      }
    }

    /* 聊天視窗 RWD */
    .chat-window {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 320px;
      height: 500px;
    }

    @media (max-width: 480px) {
      .chat-window {
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        border-radius: 0;
      }

      #chat-launcher {
        right: 20px;
        bottom: 20px;
      }
    }

    /* Modal RWD */
    .modal {
      width: 90%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
    }

    @media (max-width: 480px) {
      .modal {
        width: 95%;
        padding: 16px !important;
      }

      .modal h1 {
        font-size: 20px;
      }

      .modal input {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <!-- 上方固定 Header，配合 RWD -->
  <header style="position: relative;">
    <div>
      <h1>🐱 貓臉辨識</h1>
      <p class="api">API：<span id="api-url"></span></p>
      <p class="known">已知貓咪：<span id="knownCats">載入中…</span></p>
    </div>

    <button class="hamburger" id="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav id="nav-menu">
      <a href="#" class="current-page">貓臉辨識</a>
      <a href="/static/aboutus.html">關於我們</a>
      <div style="border-top: 1px solid rgba(255,255,255,0.2); margin: 8px 0;"></div>
      <p id="userEmail"></p>
      <button id="navBtnLogin">登入</button>
      <button id="navBtnRegister">註冊</button>
      <button id="navBtnLogout" style="display:none;">登出</button>
    </nav>
  </header>

  <!-- 內文包在 .wrap 裡，讓 padding / 宽度生效 -->
  <div class="wrap">
    <!-- 相機區 -->
    <section>
      <h1>貓臉辨識</h1>

      <div class="cam-box">
        <video id="preview" autoplay playsinline></video>
        <canvas id="overlay" class="overlay"></canvas>
      </div>

      <div class="btns">
        <button id="btnStart">開啟相機</button>
        <button id="btnShot">拍照辨識</button>
      </div>

      <div class="panel">
        <div class="row">
          <span class="tag">狀態</span>
          <span id="status" class="small">尚未啟動</span>
        </div>
      </div>
    </section>


    <button id="chat-launcher" style="display: none;">
      🐱
    </button>

    <section id="chat-card" class="chat-window" style="display: none;">
      <div class="chat-header">
        <div class="title">
            <span>AI貓咪村長</span>
            <span id="chat-status" style="font-size:0.8em; color:#bfbfbf;">(線上)</span>
        </div>
        <button id="btn-close-chat" class="close-btn">×</button>
      </div>

      <div id="chat-box"></div>

      <div class="chat-footer">
        <textarea id="chat-input" rows="1" placeholder="輸入訊息..."></textarea>
        <div class="chat-actions">
            <button id="btn-logout" class="btn-small secondary">登出</button>
            <button id="btn-send" class="btn-small primary">送出</button>
        </div>
      </div>
    </section>


  </div>

  <!-- Login Modal -->
  <div id="loginModal" class="backdrop hidden">
    <div class="modal">
      <img id="modalCloseLogin" src="/static/more_img/close.png" alt="close" />
      <h1>登入</h1>
      <p>Email</p>
      <input id="loginEmail" type="email" />
      <p style="margin-top:12px;">密碼</p>
      <input id="loginPwd" type="password" />
      <div id="loginError" class="error" style="margin-top:8px; color:#c00; font-size:14px;"></div>
      <button id="btnDoLogin" class="secondary" style="margin-top:16px;">登入</button>
      <p style="margin-top:12px; font-size:14px;">
        還沒有帳號？
        <button id="gotoRegister" class="secondary" style="flex:0 0 auto; padding:6px 12px;">註冊</button>
      </p>
    </div>
  </div>

  <!-- Register Modal -->
  <div id="registerModal" class="backdrop hidden">
    <div class="modal">
      <img id="modalCloseRegister" src="/static/more_img/close.png" alt="close" />
      <h1>註冊</h1>
      <p>Email</p>
      <input id="regEmail" type="email" />
      <p style="margin-top:12px;">密碼</p>
      <input id="regPwd" type="password" />
      <div id="regError" class="error" style="margin-top:8px; color:#c00; font-size:14px;"></div>
      <button id="btnDoRegister" class="secondary" style="margin-top:16px;">註冊</button>
      <p style="margin-top:12px; font-size:14px;">
        已經有帳號？
        <button id="gotoLogin" class="secondary" style="flex:0 0 auto; padding:6px 12px;">改成登入</button>
      </p>
    </div>
  </div>

  <!-- 貓爪游標 -->
  <img id="cat-cursor" src="/static/more_img/cat_hand.png" alt="cursor" />

  <script type="module">
    // =========================
    // 1. Firebase 初始化
    // =========================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDcvsZn418xMLXL9KuM5FQaAmFhtsCvd8E",
      authDomain: "cat-f-id.firebaseapp.com",
      databaseURL: "https://cat-f-id-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "cat-f-id",
      storageBucket: "cat-f-id.firebasestorage.app",
      messagingSenderId: "717846269620",
      appId: "1:717846269620:web:4b6d0ae716b7b60ae891e1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.debugGetToken = async () => {
      const user = auth.currentUser;
      if (!user) {
        console.log("尚未登入");
        return;
      }
      const t = await user.getIdToken(true);
      console.log("ID TOKEN =", t);
      return t;
    };

    // =========================
    // 2. 後端 API 設定
    // =========================
    const API_URL = 'https://cat-f-id.onrender.com/predict';
    const API_BASE = API_URL.replace("/predict", "");

    const apiUrlEl   = document.getElementById("api-url");
    if (apiUrlEl) apiUrlEl.textContent = API_URL;

    // =========================
    // 3. 頁面元素
    // =========================
    const video     = document.getElementById("preview");
    const overlay   = document.getElementById("overlay");
    const ctx       = overlay ? overlay.getContext("2d") : null;

    const statusEl  = document.getElementById("status");
    const btnStart  = document.getElementById("btnStart");
    const btnShot   = document.getElementById("btnShot");
    const knownCats = document.getElementById("knownCats");

    const navBtnLogin    = document.getElementById("navBtnLogin");
    const navBtnLogout   = document.getElementById("navBtnLogout");
    const navBtnRegister = document.getElementById("navBtnRegister");
    const userEmailSpan  = document.getElementById("userEmail");

    const loginModal       = document.getElementById("loginModal");
    const loginEmail       = document.getElementById("loginEmail");
    const loginPwd         = document.getElementById("loginPwd");
    const btnDoLogin       = document.getElementById("btnDoLogin");
    const btnCancelLogin   = document.getElementById("btnCancelLogin");
    const loginError       = document.getElementById("loginError");
    const modalCloseLogin  = document.getElementById("modalCloseLogin");

    const registerModal      = document.getElementById("registerModal");
    const regEmail           = document.getElementById("regEmail");
    const regPwd             = document.getElementById("regPwd");
    const btnDoRegister      = document.getElementById("btnDoRegister");
    const regError           = document.getElementById("regError");
    const gotoRegister       = document.getElementById("gotoRegister");
    const gotoLogin          = document.getElementById("gotoLogin");
    const modalCloseRegister = document.getElementById("modalCloseRegister");

    const chatCard      = document.getElementById("chat-card");
    const chatBox       = document.getElementById("chat-box");
    const chatInput     = document.getElementById("chat-input");
    const btnSend       = document.getElementById("btn-send");
    const btnChatLogout = document.getElementById("btn-logout");
    const launcherBtn   = document.getElementById("chat-launcher");
    const closeChatBtn  = document.getElementById("btn-close-chat");

    // =========================
    // 4. 共用小工具
    // =========================
    function setStatus(s) {
      if (!statusEl) return;
      statusEl.textContent = s;
    }

    function clearOverlay() {
      if (!ctx || !overlay) return;
      ctx.clearRect(0, 0, overlay.width, overlay.height);
    }

    function resizeOverlay() {
      if (!video || !overlay || !ctx) return;
      const rect = video.getBoundingClientRect();
      overlay.width  = rect.width * devicePixelRatio;
      overlay.height = rect.height * devicePixelRatio;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      clearOverlay();
    }
    window.addEventListener("resize", resizeOverlay);

    async function getFirebaseTokenOrThrow() {
      const user = auth.currentUser;
      if (!user) throw new Error("尚未登入");
      return await user.getIdToken();
    }

    // =========================
    // 5. Firebase 登入/註冊/登出（有配合 .backdrop CSS）
    // =========================
    function openBackdrop(el) {
      if (!el) return;
      el.classList.remove("hidden");
      el.style.display = "flex";     // 讓它蓋過 .backdrop { display:none }
    }
    function closeBackdrop(el) {
      if (!el) return;
      el.classList.add("hidden");
      el.style.display = "none";
    }

    if (navBtnLogin) {
      navBtnLogin.addEventListener("click", (e) => {
        e.preventDefault();
        if (!loginModal) return;
        if (loginError) loginError.textContent = "";
        openBackdrop(loginModal); 
      });
    }

    if (navBtnRegister) {
      navBtnRegister.addEventListener("click", (e) => {
        e.preventDefault();
        if (!registerModal) return;
        if (regError) regError.textContent = "";
        openBackdrop(registerModal);
      });
    }

    if (btnCancelLogin && loginModal) {
      btnCancelLogin.addEventListener("click", () => {
        closeBackdrop(loginModal);
      });
    }

    if (modalCloseLogin && loginModal) {
      modalCloseLogin.addEventListener("click", () => closeBackdrop(loginModal));
    }
    if (modalCloseRegister && registerModal) {
      modalCloseRegister.addEventListener("click", () => closeBackdrop(registerModal));
    }

    if (loginModal) {
      loginModal.addEventListener("click", (e) => {
        if (e.target === loginModal) closeBackdrop(loginModal);
      });
    }
    if (registerModal) {
      registerModal.addEventListener("click", (e) => {
        if (e.target === registerModal) closeBackdrop(registerModal);
      });
    }

    if (gotoRegister) {
      gotoRegister.addEventListener("click", () => {
        closeBackdrop(loginModal);
        openBackdrop(registerModal);
        if (regError) regError.textContent = "";
      });
    }

    if (gotoLogin) {
      gotoLogin.addEventListener("click", () => {
        closeBackdrop(registerModal);
        openBackdrop(loginModal);
        if (loginError) loginError.textContent = "";
      });
    }

    if (btnDoLogin) {
      btnDoLogin.addEventListener("click", async () => {
        try {
          await signInWithEmailAndPassword(auth, loginEmail.value, loginPwd.value);
          closeBackdrop(loginModal);
          loginEmail.value = "";
          loginPwd.value = "";
        } catch (e) {
          if (loginError) loginError.textContent = "登入失敗：" + e.message;
        }
      });
    }

    if (btnDoRegister) {
      btnDoRegister.addEventListener("click", async () => {
        const email = regEmail.value;
        const password = regPwd.value;
        if (password.length < 6) {
          if (regError) regError.textContent = "密碼長度需至少 6 個字元";
          return;
        }
        try {
          await createUserWithEmailAndPassword(auth, email, password);
          alert("註冊成功！已自動登入。");
          closeBackdrop(registerModal);
          regEmail.value = "";
          regPwd.value = "";
        } catch (e) {
          if (!regError) return;
          if (e.code === "auth/email-already-in-use") {
            regError.textContent = "此 Email 已經被註冊過了";
          } else {
            regError.textContent = "註冊失敗：" + e.message;
          }
        }
      });
    }

    if (navBtnLogout) {
      navBtnLogout.addEventListener("click", async (e) => {
        e.preventDefault();
        await signOut(auth);
        alert("已登出");
      });
    }
    if (btnChatLogout) {
      btnChatLogout.addEventListener("click", async () => {
        await signOut(auth);
        alert("已登出");
      });
    }

    onAuthStateChanged(auth, (user) => {
      if (!navBtnLogin || !navBtnRegister || !navBtnLogout || !userEmailSpan || !chatCard || !chatBox || !launcherBtn) return;
      if (user) {
        navBtnLogin.style.display    = "none";
        navBtnRegister.style.display = "none";
        navBtnLogout.style.display   = "inline-block";
        userEmailSpan.textContent    = user.email || "";
        
        launcherBtn.style.display = "flex"; 
        launcherBtn.style.opacity = "1";         // 確保按鈕可見
        launcherBtn.style.pointerEvents = "auto"; // 確保可點擊
        
        chatCard.style.display = "none";         // 預設關閉視窗
        chatCard.classList.remove("open");       // 確保沒有開啟的動畫 class

        loadHistory();
      } else {
        navBtnLogin.style.display    = "inline-block";
        navBtnRegister.style.display = "inline-block";
        navBtnLogout.style.display   = "none";
        userEmailSpan.textContent    = "";
        // 全部隱藏
        chatCard.style.display       = "none";
        chatCard.classList.remove("open");
        launcherBtn.style.display    = "none"; // 隱藏啟動按鈕

        chatBox.innerHTML            = "";
      }
    });

    // =========================
    // 6. 相機 & /predict
    // =========================
    let currentStream = null;
    let toJpegQuality = 0.9;

    async function startCamera() {
      try {
        const token = await getFirebaseTokenOrThrow();

        try {
          const res = await fetch(`${API_BASE}/camera_open`, {
            method: "POST",
            headers: { Authorization: `Bearer ${token}` }
          });
          if (res.ok) {
            const me = await res.json();
            console.log("後端認證的開啟者：", me.email, me.uid);
          } else {
            console.warn("呼叫 /camera_open 失敗：HTTP", res.status);
          }
        } catch (e) {
          console.warn("呼叫 /camera_open 發生錯誤：", e);
        }

        if (!video) {
          console.warn("找不到 video#preview");
          return;
        }

        if (currentStream) currentStream.getTracks().forEach(t => t.stop());
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        video.srcObject = stream;
        await video.play();
        currentStream = stream;
        resizeOverlay();
        setStatus("相機啟動成功");
      } catch (e) {
        console.error(e);
        setStatus("相機啟動失敗");
        alert("相機啟動失敗：" + e.message);
      }
    }

    async function grabVideoFrameBlob() {
      if (!video || !video.videoWidth) return null;
      const tmp = document.createElement("canvas");
      tmp.width = video.videoWidth;
      tmp.height = video.videoHeight;
      tmp.getContext("2d").drawImage(video, 0, 0, tmp.width, tmp.height);
      return await new Promise(res => tmp.toBlob(res, "image/jpeg", toJpegQuality));
    }

    async function sendToAPI(imageBlob) {
      const token = await getFirebaseTokenOrThrow();
      const fd = new FormData();
      fd.append("file", imageBlob, "shot.jpg");

      const r = await fetch(API_URL, {
        method: "POST",
        headers: { Authorization: `Bearer ${token}` },
        body: fd
      });
      if (r.status === 401) throw new Error("驗證失敗：請重新登入");
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return await r.json();
    }

    // =========================
    // 7. 貓咪卡片 & 留言
    // =========================
    const STATIC_BASE = "https://cat-f-id.onrender.com/static";
    const catImages = {
      mama: `${STATIC_BASE}/more_img/mama_headshot.png`,
      coco: `${STATIC_BASE}/more_img/coco_headshot.png`,
      jojo: `${STATIC_BASE}/more_img/jojo_headshot.png`
    };

    function createCatModal(catName, imgUrl = null) {
      const backdrop = document.createElement("div");
      backdrop.className = "backdrop";
      backdrop.style.display = "flex";

      backdrop.innerHTML = `
        <div class="modal">
          <img id="modalClose" src="${STATIC_BASE}/more_img/close.png" alt="close" />
          <div class="catresume">
            <img src="${imgUrl || catImages[catName] || `${STATIC_BASE}/more_img/unknown_cat.png`}" class="img01">
            <div>
              <div class="modalNames">
                <span class="chip">${catName}</span>
              </div>
              <div class="comment-box">
                <input type="text" class="commentInput" placeholder="匿名留言..." />
                <button class="botton02 commentBtn">發布</button>
              </div>
              <div class="comment-list"></div>
            </div>
          </div>
        </div>
      `;

      document.body.appendChild(backdrop);

      const closeBtn    = backdrop.querySelector("#modalClose");
      const commentInput = backdrop.querySelector(".commentInput");
      const commentBtn   = backdrop.querySelector(".commentBtn");
      const commentList  = backdrop.querySelector(".comment-list");

      if (closeBtn) {
        closeBtn.addEventListener("click", () => backdrop.remove());
      }
      backdrop.addEventListener("click", e => { if (e.target === backdrop) backdrop.remove(); });

      function renderComments(comments) {
        if (!commentList) return;
        commentList.innerHTML = comments.map(c => {
          if (typeof c === "string") {
            return `<div class="comment-ms"><p>${c}</p></div>`;
          }
          return `<div class="comment-ms">
                    <p><strong>${c.author || "匿名"}</strong></p>
                    <p>${c.text}</p>
                  </div>`;
        }).join("");
      }

      async function loadComments() {
        try {
          const user = auth.currentUser;
          const headers = {};
          if (user) {
            const token = await user.getIdToken();
            headers["Authorization"] = `Bearer ${token}`;
          }
          const res = await fetch(`${API_BASE}/comments?cat_name=${encodeURIComponent(catName)}`, { headers });
          const data = await res.json();
          renderComments(data.comments || []);
        } catch {
          renderComments([]);
        }
      }

      if (commentBtn && commentInput) {
        commentBtn.addEventListener("click", async () => {
          const text = commentInput.value.trim();
          if (!text) return;
          try {
            const token = await getFirebaseTokenOrThrow();
            const res = await fetch(`${API_BASE}/comment?cat_name=${encodeURIComponent(catName)}`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
              },
              body: JSON.stringify({ text })
            });
            if (res.status === 401) {
              alert("驗證失效，請重新登入");
              return;
            }
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            renderComments(data.comments || []);
            commentInput.value = "";
          } catch (e) {
            alert("留言失敗：" + e.message);
          }
        });
      }

      loadComments();
    }

    async function captureAndSend() {
      if (!video || !video.videoWidth) return;
      setStatus("擷取畫面中…");
      try {
        const blob = await grabVideoFrameBlob();
        if (!blob) return;
        setStatus("上傳辨識中…");
        const data = await sendToAPI(blob);

        const boxes = data.boxes || [];
        if (!boxes.length) {
          setStatus("沒有偵測到貓臉");
          return;
        }
        for (let i = 0; i < boxes.length; i++) {
          const b = boxes[i];
          const catKey = b.name === "Unknown" ? `Unknown_${i + 1}` : b.name;
          createCatModal(catKey, b.imgUrl || null);
          await new Promise(res => setTimeout(res, 200));
        }
        setStatus("完成");
      } catch (e) {
        console.error(e);
        alert("辨識失敗：" + e.message);
        setStatus("辨識失敗");
      }
    }

    if (btnStart) btnStart.addEventListener("click", startCamera);
    if (btnShot)  btnShot.addEventListener("click", captureAndSend);

    // =========================
    // 8. 聊天室
    // =========================
    function appendMessage(role, text) {
      if (!chatBox) return;
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.innerHTML = `<span class="role">${role === "user" ? "我" : "助理"}</span> ${text}`;
      chatBox.appendChild(div);
    }

    async function loadHistory() {
      if (!chatBox) return;
      try {
        const token = await getFirebaseTokenOrThrow();
        const res = await fetch(`${API_BASE}/history`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (!res.ok) return;
        const data = await res.json();
        chatBox.innerHTML = "";
        for (const m of data) appendMessage(m.role, m.content);
        chatBox.scrollTop = chatBox.scrollHeight;
      } catch (e) {
        console.warn("載入歷史失敗：", e);
      }
    }

    async function sendMessage() {
      if (!chatInput || !btnSend) return;
      const text = chatInput.value.trim();
      if (!text) return;
      chatInput.value = "";
      appendMessage("user", text);
      btnSend.disabled = true;
      try {
        const token = await getFirebaseTokenOrThrow();
        const res = await fetch(`${API_BASE}/chat`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ message: text })
        });
        btnSend.disabled = false;
        if (!res.ok) {
          appendMessage("assistant", "（後端錯誤：" + res.status + "）");
          return;
        }
        const data = await res.json();
        appendMessage("assistant", data.reply);
        chatBox.scrollTop = chatBox.scrollHeight;
      } catch (e) {
        btnSend.disabled = false;
        appendMessage("assistant", "（送出失敗：" + e.message + "）");
      }
    }

    if (btnSend) btnSend.addEventListener("click", sendMessage);
    if (chatInput) {
      chatInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
    }

    // =========================
    // 9. 貓爪游標 & 已知貓列表
    // =========================
    const catCursor = document.getElementById("cat-cursor");
    if (catCursor) {
      document.addEventListener("mousemove", e => {
        catCursor.style.left = `${e.clientX}px`;
        catCursor.style.top  = `${e.clientY}px`;
      });
      document.addEventListener("click", () => {
        catCursor.style.transform = "scale(0.9)";
        setTimeout(() => catCursor.style.transform = "scale(1)", 100);
      });
    }

    (async () => {
      if (!knownCats) return;
      try {
        const labelsURL = API_URL.replace("/predict", "/labels");
        const r = await fetch(labelsURL);
        const j = await r.json();
        knownCats.textContent = (j.labels || []).join("、") || "（無）";
      } catch {
        knownCats.textContent = "無法取得";
      }
    })();

    // =========================
    // 10. RWD 漢堡菜單邏輯
    // =========================
    const hamburger = document.getElementById('hamburger');
    const navMenu = document.getElementById('nav-menu');

    if (hamburger && navMenu) {
      hamburger.addEventListener('click', () => {
        hamburger.classList.toggle('active');
        navMenu.classList.toggle('active');
      });

      // 點擊菜單項目時關閉菜單
      navMenu.querySelectorAll('a, button').forEach(item => {
        item.addEventListener('click', () => {
          hamburger.classList.remove('active');
          navMenu.classList.remove('active');
        });
      });

      // 點擊視窗其他位置時關閉菜單
      document.addEventListener('click', (e) => {
        if (!hamburger.contains(e.target) && !navMenu.contains(e.target)) {
          hamburger.classList.remove('active');
          navMenu.classList.remove('active');
        }
      });
    }

    // =========================
    // 11. 聊天室開關動畫邏輯
    // =========================

    // 🟢 點擊圓形按鈕 -> 打開聊天室
    if (launcherBtn) {
        launcherBtn.addEventListener('click', () => {
            // 1. 先設定 display: flex 讓元素出現在 DOM 上
            chatCard.style.display = 'flex';

            // 2. 稍微延遲加入 class，觸發 CSS transition 動畫
            setTimeout(() => {
                chatCard.classList.add('open');
            }, 10);

            // 3. 隱藏圓形按鈕 (變成透明並不可點擊，避免擋路)
            launcherBtn.style.opacity = '0';
            launcherBtn.style.pointerEvents = 'none';
        });
    }

    // 🔴 點擊 X 按鈕 -> 關閉聊天室
    if (closeChatBtn) {
        closeChatBtn.addEventListener('click', () => {
            // 1. 移除動畫 class，視窗會縮下去
            chatCard.classList.remove('open');
            
            // 2. 恢復圓形按鈕
            launcherBtn.style.opacity = '1';
            launcherBtn.style.pointerEvents = 'auto';

            // 3. 等 CSS 動畫跑完 (0.3s) 再真的把視窗 display: none
            setTimeout(() => {
                chatCard.style.display = 'none';
            }, 300);
        });
    }
  </script>
</body>
</html>
