services:
  - type: web
    name: cat-f-id-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.index:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
    
  - type: static_site
    name: cat-f-id-frontend
    staticPublishPath: ./frontend
    buildCommand: npm run build 2>/dev/null || echo "No build needed"
    routes:
      - path: /static
        destination: /static
      - path: /
        destination: /index.html
